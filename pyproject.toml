[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigc-detect"
version = "0.1.0"
description = "Robust detection of AI-generated images under real-world transformations (TikTok TechJam 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "pillow",
    "pandas",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "kagglehub",
    "datasets",
    "huggingface-hub",
    "timm>=1.0.29",
    "transformers>=5.16.1",
    "python-dotenv>=1.2.3",
]

# Not part of the graded deliverables -- backs the Chrome-extension live demo
# only (demo/server.py). Kept out of the base dependency set on purpose so
# `uv sync` for the actual submission stays lean. Install with
# `uv sync --extra demo`.
[project.optional-dependencies]
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "requests>=2.32",
]

# Also not graded -- backs scripts/plot_stats.py, which renders the training
# curves and evaluation charts under stats/. Kept out of the base set for the
# same reason as `demo`. Install with `uv sync --extra viz`.
viz = [
    "matplotlib>=3.9",
]

# The package lives under src/. Declaring it here is what makes
# `import aigc_detect` work from anywhere -- before this, every script and both
# entry points opened with a `sys.path.insert(0, .../src)` preamble (23 files).
#
# `apps` (tier 8b) holds first-class applications that are not part of the
# graded deliverable -- today just `apps/server`, the demo's FastAPI server --
# packaged the same way so `import apps.server` works from anywhere and
# `aigc-serve` (below) is installable, with no `sys.path` hack reintroduced.
[tool.hatch.build.targets.wheel]
packages = ["src/aigc_detect", "apps"]

# `aigc <command>` is the real entry point. main.py at the repo root is kept as
# a thin shim so the documented `uv run main.py ...` invocations keep working.
# `aigc-serve` is the demo server (see apps/server/app.py); it needs the `demo`
# extra installed (`uv sync --extra demo`) since fastapi/uvicorn/requests live
# there, not in the base dependency set -- it is NOT a graded deliverable.
[project.scripts]
aigc = "aigc_detect.cli:main"
aigc-serve = "apps.server.app:main"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# "." is what makes `tests`, `apps` and `scripts` first-party to isort: they are
# top-level packages of THIS repo, not third-party installs, and without the repo
# root on this list ruff sorts `from tests.conftest import ...` in among pandas
# and pytest. "src" stays for `aigc_detect`, which lives one level down.
src = [".", "src", "scripts", "tests"]
extend-exclude = [".venv", "data", "models", "reports", "docs", ".refactor_baseline"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowing builtins
    "SIM",  # simplification
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "B008",    # function call in default arg -- argparse patterns rely on it
    "SIM108",  # ternaries are not always clearer than if/else here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
