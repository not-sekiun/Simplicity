# Tier 9: run the invariants on a machine that has never seen this project's data.
#
# WHAT A RUNNER ACTUALLY HAS. A fresh clone carries every corpus.yaml,
# index.csv, manifest recipe and resolved CSV under data/ -- 64 files -- and
# none of the ~24 GB of images they describe, no embedding cache, and no
# trained checkpoint. Every test that needs pixels, a cache or a bundle skips
# itself explicitly (tests/conftest.py's `needs_images`, test_parity.py's
# checkpoint/manifest guards), so what runs here is the whole suite minus
# exactly the parts a bare checkout cannot answer -- and a skip reads as
# "the data is not on this machine", never as a green result it did not earn.
#
# ONE TEST JOB, NOT TWO. tests/test_parity.py drives `npm test` and
# `npm run build` as subprocesses and asserts on what the two dist trees
# contain (MV3 service_worker for Chrome, gecko.id for Firefox). Those tests
# skip when demo/extension/node_modules is absent, so Node is set up in the
# same job as pytest rather than in a job of its own -- splitting them would
# leave the manifest assertions permanently skipped and nothing would say so.
#
# THE TORCH DOWNLOAD IS DELIBERATE. pyproject pins torch to the cu130 index,
# and `uv sync` here honours that rather than quietly resolving a CPU build:
# CI installs what a contributor's machine installs. This was written expecting
# it to be the slow step and it is not -- the first run, on an empty cache,
# resolved and installed the whole tree in 29 seconds. So there is no reason to
# reach for a cpu/cu130 extra pair in pyproject to make CI cheaper; if that
# changes, that pair is the fix, not a divergent install here.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A branch that gets three pushes in a minute should run CI once, on the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # Deliberately not a `uv sync`: ruff needs nothing from this project's
      # dependency tree, so this job answers in ~11s and does not wait on the
      # test job's install to tell you about a lint error.
      - run: uvx --from 'ruff>=0.16' ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact tag, not @v10: setup-uv publishes floating major aliases
      # only through v7, so `@v10` does not resolve at all.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 22, not the runner default: `npm test` in demo/extension was written
      # against a dev machine running Node 24, and the FIRST CI run caught the
      # difference -- its test script globbed `test/**/*.test.js`, which Node
      # expands itself only from 22 onward and Node 20 passed through as a
      # literal path. The script no longer globs, so this pin is belt and
      # braces rather than the fix.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/extension/package-lock.json

      - name: install the extension's build/test tooling
        working-directory: demo/extension
        run: npm ci

      # --locked: uv.lock is committed, so a pyproject edit that was never
      # re-locked fails here rather than silently resolving to something no
      # one has run. --extra demo brings in the server's fastapi/uvicorn.
      - name: install the project
        run: uv sync --locked --group dev --extra demo

      - name: pytest
        run: uv run pytest
